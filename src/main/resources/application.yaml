# ============================================================
# OhMyUniversity! - API Gateway
# Base configuration - shared across all profiles.
#
# Routes are defined programmatically in GatewayRoutesConfig
# and injected via @Value with per-profile defaults.
# ============================================================

spring:
  profiles:
    default: dev
  application:
    name: ohmyuniversity-gateway
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.oauth2.resource.reactive.ReactiveOAuth2ResourceServerAutoConfiguration
  data:
    redis:
      host: ${REDIS_CACHE_HOST:localhost}
      port: ${REDIS_CACHE_PORT:6379}
      password: ${REDIS_CACHE_PASSWORD:redis}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: always
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    export:
      enabled: false

omu:
  jwt:
    secret: ${JWT_SECRET}

# Downstream microservice URLs — single source of truth for route defaults.
# Each *Routes.java class reads its own key via @Value with a matching fallback.
auth:
  service:
    url: ${AUTH_SERVICE_URL:http://localhost:8081}

core:
  service:
    url: ${CORE_SERVICE_URL:http://localhost:8082}

fetcher:
  service:
    url: ${FETCHER_SERVICE_URL:http://localhost:8083}

chat:
  service:
    url: ${CHAT_SERVICE_URL:http://localhost:8084}

canteen:
  service:
    url: ${CANTEEN_SERVICE_URL:http://localhost:8085}

billing:
  service:
    url: ${BILLING_SERVICE_URL:http://localhost:8086}